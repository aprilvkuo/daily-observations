name: Test and preview research library
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_compare.cjs
      - run: node tests/test_library.cjs
      - name: Build static preview (never deploys)
        run: python scripts/pipeline.py build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://aprilvkuo.github.io/daily-observations' }}
      - uses: actions/upload-artifact@v4
        with:
          name: research-library-preview
          path: dist/
          include-hidden-files: true
          retention-days: 14
