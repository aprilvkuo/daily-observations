name: Archive and publish daily report
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [publish-report, publish-article]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: investment-publication
  cancel-in-progress: false
  queue: max
jobs:
  archive-build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[archive]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Validate and archive existing analysis
        if: github.event_name == 'repository_dispatch'
        run: python scripts/pipeline.py ingest-event
      - name: Commit archive only when new
        if: github.event_name == 'repository_dispatch'
        run: |
          git add reports/ articles/
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "[archive] Preserve complete daily report"
            git push origin HEAD:main
          fi
      - name: Build static archive and full RSS
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://aprilvkuo.github.io/investment-report' }}
        run: python scripts/pipeline.py build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: archive-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
